
<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Love ❤️</title>

    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <!-- Floating Hearts -->
    <div class="hearts" id="hearts"></div>

    <!-- Main Card -->
    <main class="card" id="card">

        <!-- Sticker -->
        <div class="sticker-container">
            <img
                src="../images/Cute Adorable Sticker - Cute Adorable Please - Discover & Share GIFs.gif"
                id="sticker"
                alt="Cute Sticker"
            >
        </div>

        <!-- Heading -->
        <h1 id="title">
            ကိုယ့်ကို စိတ်မကောက်တော့ဘူးမလား? 
        </h1>

        <!-- Description -->
        <p id="description">
            ကိုယ့်ကို ခွင့်လွှတ်ပေးပါနော် Noe Noe။ ❤️
            <br>
            ကိုတောင်းပန်ပါတယ်။
        </p>

        <!-- Buttons -->
        <div class="buttons" id="buttons">

            <button class="yes-btn" id="yesBtn">
                YES 💚
            </button>

            <button class="no-btn" id="noBtn">
                NO 🧡
            </button>

        </div>

        <!-- Success Message -->
        <div class="result" id="result">

            <p>
                အများကြီးချစ်တယ်နော်။ ❤️
            </p>

            <div class="love-text">
                I LOVE YOU FOREVER 💗
            </div>

        </div>

        <!-- Footer -->
        <div class="footer">
            Made with ❤️ just for you
        </div>

    </main>

    <script src="../JS/style.js"></script>

</body>
</html>
